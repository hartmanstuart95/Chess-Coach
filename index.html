<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chess Coach v0.2</title>
<style>
:root{
  --bg:#111318;--panel:#1a1d24;--text:#f4f4f5;--muted:#a1a1aa;
  --light:#eee7d5;--dark:#71836a;--sel:#facc15;--last:#60a5fa;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:0 0 6px}.sub{color:var(--muted);margin-bottom:14px}
.layout{display:grid;grid-template-columns:minmax(0,680px) minmax(300px,1fr);gap:18px;align-items:start}
@media(max-width:860px){.layout{grid-template-columns:1fr}}
.board{width:min(92vw,680px);aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);border-radius:12px;overflow:hidden;border:1px solid #333;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.sq{position:relative;display:flex;align-items:center;justify-content:center;font-size:clamp(30px,7.4vw,64px);line-height:1;border:0;padding:0;cursor:pointer}
.light{background:var(--light);color:#111}.dark{background:var(--dark);color:#111}
.sq.selected{outline:5px solid var(--sel);outline-offset:-5px}
.sq.last::after{content:"";position:absolute;inset:0;background:rgba(96,165,250,.22);pointer-events:none}
.dot{position:absolute;width:22%;aspect-ratio:1;border-radius:50%;background:rgba(20,20,20,.28)}
.coord{position:absolute;font-size:10px;font-weight:700;opacity:.62}.file{right:3px;bottom:2px}.rank{left:3px;top:2px}
.piece{position:relative;z-index:1}
.card{background:var(--panel);border:1px solid #2b303a;border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{appearance:none;border:1px solid #3b4250;background:#252a33;color:var(--text);border-radius:10px;padding:10px 13px;font-size:16px}
button.primary{background:#0ea5e9;border-color:#0ea5e9;color:#fff}
textarea{width:100%;min-height:160px;border-radius:10px;border:1px solid #3b4250;background:#101218;color:var(--text);padding:10px;font-size:14px;resize:vertical}
.status{font-size:16px;margin:8px 0}.small{font-size:13px;color:var(--muted)}
.moves{max-height:280px;overflow:auto;line-height:1.8}.movebtn{padding:3px 7px;font-size:14px;margin:2px;border-radius:7px}.activeMove{background:#0ea5e9;border-color:#0ea5e9}
.error{color:#fb7185}.ok{color:#86efac}
.badge{display:inline-block;background:#173341;color:#9ee6ff;padding:4px 8px;border-radius:999px;font-size:12px;margin-bottom:8px}
</style>
</head>
<body>
<div class="wrap">
<h1>Chess Coach v0.2</h1>
<div class="sub">Reliable PGN import + interactive analysis board.</div>

<div class="layout">
  <div>
    <div id="board" class="board" aria-label="Interactive chess board"></div>
    <div class="row" style="margin-top:10px">
      <button id="flipBtn">Flip board</button>
      <button id="undoBtn">Undo</button>
      <button id="resetBtn">Reset</button>
      <button id="backBtn">◀ Back</button>
      <button id="forwardBtn">Forward ▶</button>
    </div>
    <div id="status" class="status"></div>
    <div id="feedback" class="small" aria-live="polite">Tap a piece to see legal moves.</div>
  </div>

  <div>
    <div class="card">
      <div class="badge">PGN</div>
      <strong> Load a game</strong>
      <p class="small">Paste a complete Chess.com PGN, then tap Load PGN.</p>
      <textarea id="pgnInput" placeholder='[White "Player1"]
[Black "Player2"]
[Result "1-0"]

1. e4 c5 2. Nf3 d6 3. d4 cxd4'></textarea>
      <div class="row" style="margin-top:8px">
        <button id="loadBtn" class="primary">Load PGN</button>
        <button id="sampleBtn">Load sample</button>
      </div>
    </div>

    <div class="card">
      <strong>Game moves</strong>
      <div id="moves" class="moves small">No moves yet.</div>
    </div>

    <div class="card">
      <strong>Current position</strong>
      <div class="small">FEN</div>
      <div id="fen" style="word-break:break-all;margin-top:5px"></div>
      <div class="small" style="margin-top:10px">Next upgrade: Stockfish evaluation + best move.</div>
    </div>
  </div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
(function(){
  const U={wK:'♔',wQ:'♕',wR:'♖',wB:'♗',wN:'♘',wP:'♙',bK:'♚',bQ:'♛',bR:'♜',bB:'♝',bN:'♞',bP:'♟'};
  const files='abcdefgh';

  const boardEl=document.getElementById('board');
  const statusEl=document.getElementById('status');
  const feedbackEl=document.getElementById('feedback');
  const fenEl=document.getElementById('fen');
  const movesEl=document.getElementById('moves');
  const pgnInput=document.getElementById('pgnInput');

  let game=new Chess();
  let orientation='white';
  let selected=null;
  let legalTargets=[];
  let loadedMoves=[];   // SAN moves from imported/current line
  let cursor=0;         // number of half-moves currently shown
  let lastMove=null;

  function squareNames(){
    const fs=orientation==='white'
      ? ['a','b','c','d','e','f','g','h']
      : ['h','g','f','e','d','c','b','a'];
    const rs=orientation==='white'
      ? ['8','7','6','5','4','3','2','1']
      : ['1','2','3','4','5','6','7','8'];
    const out=[];
    for(const r of rs)for(const f of fs)out.push(f+r);
    return out;
  }

  function legalMovesFrom(square){
    return game.moves({square:square,verbose:true});
  }

  function render(){
    boardEl.innerHTML='';

    squareNames().forEach(sq=>{
      const file=sq.charCodeAt(0)-97;
      const rank=parseInt(sq[1],10)-1;
      const isLight=(file+rank)%2===1;

      const div=document.createElement('button');
      div.type='button';
      div.className='sq '+(isLight?'light':'dark');

      if(selected===sq)div.classList.add('selected');
      if(lastMove&&(lastMove.from===sq||lastMove.to===sq))div.classList.add('last');

      const p=game.get(sq);
      if(p){
        const span=document.createElement('span');
        span.className='piece';
        span.textContent=U[p.color+p.type.toUpperCase()];
        div.appendChild(span);
      }else if(legalTargets.includes(sq)){
        const dot=document.createElement('span');
        dot.className='dot';
        div.appendChild(dot);
      }

      const showFile=orientation==='white'?sq[1]==='1':sq[1]==='8';
      const showRank=orientation==='white'?sq[0]==='a':sq[0]==='h';

      if(showFile){
        const c=document.createElement('span');
        c.className='coord file';
        c.textContent=sq[0];
        div.appendChild(c);
      }
      if(showRank){
        const c=document.createElement('span');
        c.className='coord rank';
        c.textContent=sq[1];
        div.appendChild(c);
      }

      div.addEventListener('click',()=>handleSquare(sq));
      boardEl.appendChild(div);
    });

    let txt=game.turn()==='w'?'White to move':'Black to move';
    if(game.in_checkmate())txt+=' — Checkmate';
    else if(game.in_check())txt+=' — Check';
    else if(game.in_draw())txt+=' — Draw';

    statusEl.textContent=txt;
    fenEl.textContent=game.fen();
    renderMoves();
  }

  function handleSquare(sq){
    feedbackEl.textContent='';

    if(!selected){
      const p=game.get(sq);
      if(p&&p.color===game.turn()){
        selected=sq;
        legalTargets=legalMovesFrom(sq).map(m=>m.to);
        render();
      }
      return;
    }

    if(sq===selected){
      selected=null;
      legalTargets=[];
      render();
      return;
    }

    const own=game.get(sq);
    if(own&&own.color===game.turn()){
      selected=sq;
      legalTargets=legalMovesFrom(sq).map(m=>m.to);
      render();
      return;
    }

    let move=null;
    try{
      move=game.move({from:selected,to:sq,promotion:'q'});
    }catch(e){}

    if(!move){
      feedbackEl.textContent='Illegal move.';
      feedbackEl.className='small error';
      selected=null;
      legalTargets=[];
      render();
      return;
    }

    lastMove={from:move.from,to:move.to};
    selected=null;
    legalTargets=[];

    if(cursor<loadedMoves.length){
      loadedMoves=loadedMoves.slice(0,cursor);
    }
    loadedMoves.push(move.san);
    cursor=loadedMoves.length;

    feedbackEl.textContent='Played '+move.san;
    feedbackEl.className='small ok';
    render();
  }

  function rebuildTo(n){
    const rebuilt=new Chess();
    let lm=null;

    for(let i=0;i<n;i++){
      let m=null;
      try{m=rebuilt.move(loadedMoves[i]);}catch(e){}
      if(!m){
        feedbackEl.textContent='Could not rebuild move '+(i+1)+': '+loadedMoves[i];
        feedbackEl.className='small error';
        return;
      }
      lm={from:m.from,to:m.to};
    }

    game=rebuilt;
    cursor=n;
    lastMove=lm;
    selected=null;
    legalTargets=[];
    render();
  }

  function renderMoves(){
    if(!loadedMoves.length){
      movesEl.textContent='No moves yet.';
      return;
    }

    movesEl.innerHTML='';

    for(let i=0;i<loadedMoves.length;i++){
      if(i%2===0){
        const num=document.createElement('span');
        num.textContent=(Math.floor(i/2)+1)+'. ';
        movesEl.appendChild(num);
      }

      const b=document.createElement('button');
      b.type='button';
      b.className='movebtn'+(cursor===i+1?' activeMove':'');
      b.textContent=loadedMoves[i];
      b.addEventListener('click',()=>rebuildTo(i+1));
      movesEl.appendChild(b);

      if(i%2===1)movesEl.appendChild(document.createElement('br'));
    }
  }

  document.getElementById('flipBtn').addEventListener('click',()=>{
    orientation=orientation==='white'?'black':'white';
    render();
  });

  document.getElementById('resetBtn').addEventListener('click',()=>{
    game=new Chess();
    loadedMoves=[];
    cursor=0;
    lastMove=null;
    selected=null;
    legalTargets=[];
    feedbackEl.textContent='Board reset.';
    feedbackEl.className='small';
    render();
  });

  document.getElementById('undoBtn').addEventListener('click',()=>{
    if(cursor>0)rebuildTo(cursor-1);
  });

  document.getElementById('backBtn').addEventListener('click',()=>{
    if(cursor>0)rebuildTo(cursor-1);
  });

  document.getElementById('forwardBtn').addEventListener('click',()=>{
    if(cursor<loadedMoves.length)rebuildTo(cursor+1);
  });

  document.getElementById('sampleBtn').addEventListener('click',()=>{
    pgnInput.value='[White "AFake46"]\\n[Black "sjh002"]\\n[Result "0-1"]\\n\\n1. e4 c5 2. c4 Nf6 3. f4 Nxe4 4. Nc3 Nf6 5. Nd5 Ne4 6. Bd3 Nd6 7. Nf3 e6 8. Ne5 exd5 9. cxd5 f6 10. Ng4 f5 11. Qe2+ Be7 12. Nf2 O-O 13. g4 Bh4 14. Rg1 Re8 15. gxf5 Rxe2+ 16. Kxe2 Qe7+ 17. Kf3 b6 18. f6 Qxf6 19. Ng4 Qd4 20. Be2 Qxd5+ 21. Ke3 Nf5# 0-1';
    feedbackEl.textContent='Sample inserted. Tap Load PGN.';
    feedbackEl.className='small';
  });

  document.getElementById('loadBtn').addEventListener('click',()=>{
    const pgn=pgnInput.value.trim();

    if(!pgn){
      feedbackEl.textContent='Paste a PGN first.';
      feedbackEl.className='small error';
      return;
    }

    const temp=new Chess();
    let ok=false;

    try{
      ok=temp.load_pgn(pgn,{sloppy:true});
    }catch(e){
      ok=false;
    }

    if(!ok){
      feedbackEl.textContent='Could not read that PGN. Check that the full game notation was copied.';
      feedbackEl.className='small error';
      return;
    }

    loadedMoves=temp.history();

    game=new Chess();
    cursor=0;
    lastMove=null;
    selected=null;
    legalTargets=[];

    feedbackEl.textContent='PGN loaded: '+loadedMoves.length+' half-moves.';
    feedbackEl.className='small ok';

    rebuildTo(loadedMoves.length);
  });

  if(typeof Chess==='undefined'){
    feedbackEl.textContent='Chess library failed to load. Refresh the page while connected to the internet.';
    feedbackEl.className='small error';
  }else{
    render();
  }
})();
</script>
</body>
</html>
